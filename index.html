<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo Rafaela Ferreira</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #333333;
            color: white;
        }

        header {
            background-color: #990100;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        nav {
            text-align: center;
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            color: #ffcc00;
        }

        .foto {
            width: 250px;
            border: 8px groove #990100;
        }

        .conteudo {
            background-color: #444444;
            padding: 40px 20px;
        }

        .caixa {
            background-color: #555555;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        footer {
            background-color: #990100;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Currículo</h1>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </nav>
</header>

<main class="conteudo">

    <section id="inicio" class="container text-center">
        <img
            src="https://cajui.ifnmg.edu.br/arquivo/avatar/90/d6b6919f-a156-455b-982f-6bce95f4868d.png?m=1789426996"
            alt="Foto de Rafaela"
            class="foto img-fluid mb-4">

        <h2>Início</h2>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="caixa">
                    <h3>Nome</h3>
                    <p>Rafaela Ferreira Lima</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="caixa">
                    <h3>Idade</h3>
                    <p>18 anos</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="caixa">
                    <h3>Diplomas</h3>
                    <p>Curso Técnico de Manutenção e Suporte em Informática</p>
                </div>
            </div>
        </div>
    </section>

    <section id="sobre" class="container text-center py-5">
        <h2>Sobre</h2>

        <div class="caixa mt-4">
            <p>
                Moro em Bonito de Minas-MG, nascida em Januária,
                atualmente com 18 anos.
            </p>
        </div>
    </section>

    <section id="contato" class="container text-center py-5">
        <h2>Contato</h2>

        <div class="caixa mt-4">
            <p><strong>Instagram:</strong> @rafa.pretty</p>
        </div>
    </section>

</main>

<footer>
    <p class="mb-0">Todos os direitos reservados</p>
</footer>

</body>
      </html>
